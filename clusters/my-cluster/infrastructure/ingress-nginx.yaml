# ingress-nginx — IngressClass "nginx" для обох середовищ. На single-node стенді
# (Rancher Desktop / Minikube) сервіс типу LoadBalancer отримає вузловий IP або
# 127.0.0.1; на хмарному кластері — зовнішній LB.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 30m
  releaseName: ingress-nginx
  targetNamespace: ingress-nginx
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: ingress-nginx
      version: "4.15.x"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      replicaCount: 1
      service:
        type: LoadBalancer
      ingressClassResource:
        name: nginx
        default: true             # робимо IngressClass nginx дефолтним
      admissionWebhooks:
        enabled: true

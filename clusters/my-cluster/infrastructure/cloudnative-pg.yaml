# CloudNativePG Operator — постачає CRD Cluster/Backup/ScheduledBackup та контролер,
# що матеріалізує StatefulSet+Service+Secret для PostgreSQL-кластера.
# Інстанси БД (kind: Cluster) рендеряться шаблоном charts/n8n-env/templates/postgres-cluster.yaml.
#
# CRD керуються Helm-ом (crds: Create / CreateReplace). Для прод-кластерів
# рекомендований паттерн — окрема Flux Kustomization з CRD-маніфестами +
# чарт з `--skip-crds`. Для навчального стенда залишаємо Helm-managed.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  releaseName: cnpg
  targetNamespace: cnpg-system
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.28.x"           # пін мінорки (latest 0.28.2 станом на травень 2026)
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    monitoring:
      podMonitorEnabled: false    # увімкніть з kube-prometheus-stack

# Дефолти ≈ staging. Кожне середовище перевизначає через spec.values у HelmRelease.

# Ім'я namespace, який чарт створить. HelmRelease не керує namespace через
# targetNamespace, бо ми хочемо щоб NS був ресурсом цього самого релізу — це
# знімає курячо-яєчну проблему "namespace мусить існувати до Secret".
namespace: staging

# Лейбли для NS — корисно для NetworkPolicy/PodSecurity admission.
# Дефолт порожній: кожне середовище зобов'язане задати environment явно у своєму
# HelmRelease (apps/{staging,production}/env.yaml). Інакше production-namespace
# міг би тихо успадкувати staging-лейбл.
namespaceLabels: {}

# УВАГА: plaintext placeholder. Перед деплоєм замінити на справжній ключ через
# SOPS / Sealed Secrets / External Secrets Operator.
# Один ключ для всіх реплік n8n у межах одного env, інакше credentials не розшифруються.
n8n:
  encryptionKey: "REPLACE_BEFORE_DEPLOY"

# CloudNativePG Cluster — БД для n8n. Підтримує і dev (1 instance), і HA (3 instances).
postgres:
  name: n8n-postgres          # CNPG створить Secret <name>-app з полями host/port/user/password/dbname
  # image: ""                 # порожньо => оператор обирає підтримуваний дефолт.
  #                              Перевизначте для пінінгу мажорної версії, напр.
  #                              "ghcr.io/cloudnative-pg/postgresql:17.2"
  image: ""
  instances: 1
  storage:
    size: 1Gi
    # storageClass: ""        # порожньо => дефолтний SC кластера
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  database:
    name: n8n                 # ім'я БД
    owner: n8n                # роль-власник
  # HA: задавайте minSyncReplicas/maxSyncReplicas у prod overrides.
  minSyncReplicas: 0
  maxSyncReplicas: 0
  # Anti-affinity. На single-node кластері встановіть enablePodAntiAffinity=false.
  # Структура — як у CNPG Cluster.spec.affinity.
  affinity: {}
  #   enablePodAntiAffinity: false        # дозволити кілька instance на одному вузлі

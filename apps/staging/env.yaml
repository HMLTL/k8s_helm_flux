# Env-glue для staging: Namespace + N8N Secret + CNPG Cluster.
# Чарт лежить у цьому ж репозиторії (./charts/n8n-env) — sourceRef вказує на
# GitRepository "flux-system", який створює `flux bootstrap`.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n-env-staging
  namespace: flux-system
spec:
  interval: 1m
  releaseName: n8n-env-staging
  dependsOn:
    - name: cloudnative-pg            # CRD Cluster має бути зареєстрована
  driftDetection:
    mode: enabled                     # self-healing
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: ./charts/n8n-env
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    namespace: staging
    namespaceLabels:
      environment: staging
    n8n:
      encryptionKey: "staging-demo-key-change-me"
    postgres:
      instances: 1                    # dev — без HA
      storage:
        size: 1Gi
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"

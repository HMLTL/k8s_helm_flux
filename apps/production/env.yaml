# Env-glue для production: HA Postgres (3 instances + sync replica), 10Gi storage.
# На single-node стенді поди залишаться Pending — зменшіть instances до 1 для локалу.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n-env-production
  namespace: flux-system
spec:
  interval: 1m
  releaseName: n8n-env-production
  dependsOn:
    - name: cloudnative-pg
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: ./charts/n8n-env
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    namespace: production
    namespaceLabels:
      environment: production
    n8n:
      encryptionKey: "production-demo-key-replace-with-sops"
    postgres:
      instances: 3                    # HA: 1 primary + 2 standby
      minSyncReplicas: 1
      maxSyncReplicas: 1
      storage:
        size: 10Gi
        # storageClass: ssd-retain
      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
